name: Agent05 Actual FINS ClaimId and SID Anti-Tamper

on:
  pull_request:
    paths:
      - 'csharp/qa/p0_claim_fins_antitamper.py'
      - 'csharp/qa/test_p0_claim_fins_antitamper.py'
      - 'csharp/tests/AOI.Tests/Agent05ClaimWireTamperTests.cs'
      - '.github/workflows/csharp-agent05-sixth-antitamper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-five-process-fins-tamper:
    name: a5-fins-claim-antitamper-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and compile actual .NET 10 software plus Agent05 CSharp NUnit
        shell: bash
        run: |
          unset PLATFORM
          dotnet restore AOI.slnx --source https://api.nuget.org/v3/index.json -p:NuGetAudit=false
          dotnet build AOI.slnx --no-restore -c Debug
      - name: Test standalone Agent05 anti-tamper verifier against synthetic negative fixtures
        shell: bash
        run: |
          python -m unittest discover -s qa -p 'test_p0_claim_fins_antitamper.py' -v
      - name: Real three scenarios with FIVE OS processes each and A1 one-time Claim WAL
        shell: bash
        run: |
          python scripts/e2e_a0_final_output_journal.py --evidence-root .artifacts/a5-sixth-claim-real
      - name: Independent A0 baseline check against actual A1 A2 A7 original byte SHA
        shell: bash
        run: |
          python scripts/e2e_a0_raw_fins_audit.py --evidence-root .artifacts/a5-sixth-claim-real
      - name: Agent05 independently accept original and reject 32 single-field evidence manipulations
        shell: bash
        run: |
          python qa/p0_claim_fins_antitamper.py \
            --evidence-root .artifacts/a5-sixth-claim-real \
            --tamper-all --tamper-root .artifacts/a5-sixth-claim-copied-tamper
      - name: Native CSharp NUnit independent genuine FINS byte, SID and ClaimId checks
        shell: bash
        run: |
          export AOI_A5_TAMPER_EVIDENCE_ROOT="$PWD/.artifacts/a5-sixth-claim-real"
          dotnet test tests/AOI.Tests/AOI.Tests.csproj --no-build -c Debug \
            --filter FullyQualifiedName~Agent05ClaimWireTamperTests \
            --logger 'console;verbosity=normal'
      - name: Preserve original real UDP/WAL evidence and isolated tampered copies for A0 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-sixth-real-claim-tamper-${{ matrix.os }}-${{ github.run_id }}
          path: |
            csharp/.artifacts/a5-sixth-claim-real/
            csharp/.artifacts/a5-sixth-claim-copied-tamper/
          if-no-files-found: warn
          retention-days: 10
