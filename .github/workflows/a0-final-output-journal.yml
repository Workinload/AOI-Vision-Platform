name: A0 Final FINS WAL Intent Real Five-Process Gate
on:
  pull_request:
    paths: ['csharp/src/AOI.Host/**', 'csharp/src/AOI.Runtime/Agent01/FinalPlcOutputJournal.cs', 'csharp/src/AOI.Runtime/Plc/LegacyPlcShadow.cs', 'csharp/scripts/e2e_a0_final_output_journal.py', 'csharp/scripts/e2e_a0_raw_fins_audit.py', 'csharp/scripts/e2e_a0_readonly_recovery.py', 'csharp/scripts/e2e_a0_cross_ledger.py', 'csharp/scripts/e2e_sim_full.py', '.github/workflows/a0-final-output-journal.yml']
  push:
    branches: ['migration/csharp-avalonia-20261016']
    paths: ['csharp/src/AOI.Host/**', 'csharp/src/AOI.Runtime/Agent01/FinalPlcOutputJournal.cs', 'csharp/src/AOI.Runtime/Plc/LegacyPlcShadow.cs', 'csharp/scripts/e2e_a0_final_output_journal.py', 'csharp/scripts/e2e_a0_raw_fins_audit.py', 'csharp/scripts/e2e_a0_readonly_recovery.py', 'csharp/scripts/e2e_a0_cross_ledger.py', 'csharp/scripts/e2e_sim_full.py', '.github/workflows/a0-final-output-journal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  irreversible-fins:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned NuGet dependencies
        shell: bash
        run: |
          unset PLATFORM
          dotnet restore AOI.slnx --source https://api.nuget.org/v3/index.json -p:NuGetAudit=false
      - name: Compile actual Master Slave vPLC and Avalonia UIs
        shell: bash
        run: |
          unset PLATFORM
          dotnet build AOI.slnx --no-restore -c Debug
      - name: Real five-process A1 final WAL claims versus actual FINS SID and ACK-loss interlock
        run: python scripts/e2e_a0_final_output_journal.py --evidence-root .artifacts/a0-final-output-journal
      - name: Independently reconcile A1 ClaimId and A7 raw FINS SHA with actual vPLC UDP packets
        run: python scripts/e2e_a0_raw_fins_audit.py --evidence-root .artifacts/a0-final-output-journal
      - name: Offline forensic operator view is read-only against normal HOLD and unknown-ACK WAL
        run: python scripts/e2e_a0_readonly_recovery.py --evidence-root .artifacts/a0-final-output-journal
      - name: Read-only A0 Host A1-A7 CrossLedger per-workpiece causal proof and original DB hashes
        run: python scripts/e2e_a0_cross_ledger.py --evidence-root .artifacts/a0-final-output-journal
      - name: Published A6 legacy brightness actually inspects real PNGs after nine PLC camera handshakes
        run: python scripts/e2e_sim_full.py --legacy-shadow --with-images --with-product --count 3 --timeout 80 --evidence-root .artifacts/a0-a6-published-bright
      - name: Published CH06 OpenCV contour must change exact raw PNG workpiece result
        run: python scripts/e2e_sim_full.py --legacy-shadow --with-images --with-product --with-published-contour --count 3 --timeout 80 --evidence-root .artifacts/a0-a6-published-contour
      - name: Upload failure evidence for A0
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a0-final-fins-${{ matrix.os }}-${{ github.run_id }}
          path: |
            csharp/.artifacts/a0-final-output-journal/
            csharp/.artifacts/a0-a6-published-bright/
            csharp/.artifacts/a0-a6-published-contour/
          retention-days: 14
