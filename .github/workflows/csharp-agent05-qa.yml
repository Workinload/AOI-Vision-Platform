name: Agent05 CSharp SIM_ONLY Quality Gate
on:
  push:
    branches: ['migration/csharp-avalonia-20261016']
    paths: ['csharp/**', '.github/workflows/csharp-agent05-qa.yml']
  pull_request:
    paths: ['csharp/**', '.github/workflows/csharp-agent05-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sim-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows PowerShell 5.1 real operator script syntax
        if: matrix.os == 'windows-2025'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'qa/Windows-Operator-Smoke.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'A5_WINDOWS_OPERATOR_SMOKE_SYNTAX_PASS'
      - name: Independent virtual FINS fault-fixture Python unit tests
        run: python -m unittest discover -s qa -p 'test_*.py' -v
      - name: Restore pinned dependencies
        shell: bash
        run: |
          unset PLATFORM
          dotnet restore AOI.slnx --source https://api.nuget.org/v3/index.json -p:NuGetAudit=false
      - name: Build and NUnit negative path tests
        shell: bash
        run: |
          unset PLATFORM
          dotnet build AOI.slnx --no-restore -c Debug
          dotnet test AOI.slnx --no-build -c Debug --logger 'console;verbosity=normal'
      - name: Real five-process normal scenario
        run: python scripts/e2e_sim_light.py --evidence-root .artifacts/qa-normal
      - name: Verify SQLite WAL identities source images and PERSISTED_ACK
        run: python qa/integrity_audit.py --evidence-root .artifacts/qa-normal
      - name: Real five-process 9-device 11-channel SIM_LIGHT integration
        run: python scripts/e2e_sim_light.py --all-channels --evidence-root .artifacts/qa-11channels
      - name: Real five-process controlled barcode flip fail closed
        run: python qa/chaos_e2e.py --evidence-root .artifacts/qa-barcode-flip
      - name: Full 11-channel independent asset and PeerLink audit with corrupted end barcode
        run: python qa/chaos_e2e.py --all-channels --evidence-root .artifacts/qa-11channels-barcode-flip
      - name: SIM_FULL five-process FIFO multi-workpiece with repeated barcodes
        run: python scripts/e2e_sim_full.py --count 5 --repeat-barcode --evidence-root .artifacts/simfull-normal
      - name: P0 nine physical cameras, both Cores and 11 results request-first actual five-process FINS
        run: python scripts/e2e_sim_full.py --legacy-shadow --with-images --st05-order REQUEST_FIRST --count 5 --evidence-root .artifacts/p0-nine-cameras-request-first
      - name: P0 nine physical cameras both Cores frame-first actual five-process FINS
        run: python scripts/e2e_sim_full.py --legacy-shadow --with-images --st05-order FRAME_FIRST --count 5 --evidence-root .artifacts/p0-nine-cameras-frame-first
      - name: P0 five concurrent identical-barcode workpieces keep physical capture IDs isolated
        run: python scripts/e2e_sim_full.py --legacy-shadow --with-images --repeat-barcode --count 5 --evidence-root .artifacts/p0-nine-cameras-duplicate-barcode
      - name: P0 legacy line parent row1 and row2 split through real dual-Core five-process FINS
        run: python scripts/e2e_sim_full.py --legacy-shadow --with-images --line-row-mapping LEGACY_DROP_ROW0 --count 5 --evidence-root .artifacts/p0-legacy-line-row1-row2
      - name: A5 independent legacy line-mapping end-to-end raw FINS and causal identity
        run: python qa/p0_five_process_acceptance.py --audit-existing --count 5 --ordering REQUEST_FIRST --expected-status NG --verify-final --evidence-root .artifacts/p0-legacy-line-row1-row2
      - name: A5 independent actual FINS raw SID and A7 causal pipeline request-first
        run: python qa/p0_five_process_acceptance.py --audit-existing --count 5 --ordering REQUEST_FIRST --expected-status NG --verify-final --evidence-root .artifacts/p0-nine-cameras-request-first
      - name: A5 independent actual FINS raw SID and A7 causal pipeline frame-first
        run: python qa/p0_five_process_acceptance.py --audit-existing --count 5 --ordering FRAME_FIRST --expected-status NG --verify-final --evidence-root .artifacts/p0-nine-cameras-frame-first
      - name: A5 independent physical FINS causal proof with duplicate-barcode workpieces
        run: python qa/p0_five_process_acceptance.py --audit-existing --count 5 --ordering REQUEST_FIRST --expected-status NG --verify-final --repeat-barcode --evidence-root .artifacts/p0-nine-cameras-duplicate-barcode
      - name: P0 one missing Slave physical camera frame holds exact item on both Cores
        run: python scripts/e2e_sim_full.py --legacy-shadow --with-images --count 3 --missing-frame-token 3 --missing-frame-device HIK-S-2 --evidence-root .artifacts/p0-slave-missing-frame-hold
      - name: SIM_FULL five-process end-barcode corruption must block physical exit
        run: python scripts/e2e_sim_full.py --count 5 --flip-token 3 --evidence-root .artifacts/simfull-flipped
      - name: A6 immutable solution edit publish dual-node commit and live SIM_FULL recipe
        run: python scripts/e2e_sim_full.py --with-product --count 5 --evidence-root .artifacts/simfull-recipe
      - name: SIM_FULL actual operator PNGs, OpenCV contour NG and line row-deinterleave
        run: python scripts/e2e_sim_full.py --with-images --count 5 --evidence-root .artifacts/simfull-real-png
      - name: P0 wire-and-frame audit of actual five-process SIM_FULL evidence
        shell: bash
        run: |
          set +e
          python qa/p0_five_process_acceptance.py --audit-existing --count 5 \
            --ordering REQUEST_FIRST --expected-status NG \
            --evidence-root .artifacts/simfull-real-png \
            > .artifacts/p0-independent-fins-audit.log 2>&1
          audit_status=$?
          set -e
          cat .artifacts/p0-independent-fins-audit.log
          if [ "$audit_status" -eq 3 ]; then
            echo 'A5_P0_NOT_VERIFIED: five real demo processes passed but A2 raw FINS/A7 causal Host evidence is not connected yet'
          elif [ "$audit_status" -eq 0 ]; then
            echo 'A5_P0_REAL_FINS_FRAME_CAUSAL_PASS'
          else
            echo "A5_P0_INDEPENDENT_AUDIT_FAIL exit=$audit_status"
            exit "$audit_status"
          fi
      - name: Publish Windows x64 framework-dependent SIM_ONLY preview
        if: matrix.os == 'windows-2025'
        shell: bash
        run: |
          set -e
          unset PLATFORM
          dotnet restore AOI.slnx -r win-x64 --source https://api.nuget.org/v3/index.json -p:NuGetAudit=false
          dotnet publish src/AOI.Host/AOI.Host.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/Host
          dotnet publish src/AOI.Ui.Avalonia/AOI.Ui.Avalonia.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/UI
          dotnet publish src/AOI.Diagnostics.Cli/AOI.Diagnostics.Cli.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/Diagnostics
          dotnet publish src/AOI.Solutions.Cli/AOI.Solutions.Cli.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/Recipes
          dotnet publish tools/AOI.Vision.Cli/AOI.Vision.Cli.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/VisionLab
          cp scripts/Launch-SIM11.cmd .artifacts/dist/AOI_SIM11_Windows/Launch-SIM11.cmd
          cp scripts/Launch-SIMFULL.cmd .artifacts/dist/AOI_SIM11_Windows/Launch-SIMFULL.cmd
          cp scripts/Launch-SIMFULL-Images.cmd .artifacts/dist/AOI_SIM11_Windows/Launch-SIMFULL-Images.cmd
          cp scripts/Configure-SIM-Recipe.cmd .artifacts/dist/AOI_SIM11_Windows/Configure-SIM-Recipe.cmd
          cp scripts/WINDOWS_SIM11_PREVIEW.txt .artifacts/dist/AOI_SIM11_Windows/README.txt
          cp qa/Windows-Operator-Smoke.ps1 .artifacts/dist/AOI_SIM11_Windows/Windows-Operator-Smoke.ps1
          cp qa/Run-Windows-Operator-Smoke.cmd .artifacts/dist/AOI_SIM11_Windows/Run-Windows-Operator-Smoke.cmd
          cp qa/WINDOWS_OPERATOR_MANUAL.md .artifacts/dist/AOI_SIM11_Windows/OPERATOR_QA_README.md
          test -f .artifacts/dist/AOI_SIM11_Windows/Windows-Operator-Smoke.ps1
          test -f .artifacts/dist/AOI_SIM11_Windows/Run-Windows-Operator-Smoke.cmd
          test -f .artifacts/dist/AOI_SIM11_Windows/Launch-SIMFULL-Images.cmd
          test -f .artifacts/dist/AOI_SIM11_Windows/Host/AOI.Host.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/UI/AOI.Ui.Avalonia.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/Diagnostics/AOI.Diagnostics.Cli.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/Recipes/AOI.Solutions.Cli.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/VisionLab/AOI.Vision.Cli.exe
          dotnet .artifacts/dist/AOI_SIM11_Windows/Diagnostics/AOI.Diagnostics.Cli.dll verify .artifacts/qa-11channels/diagnostics/evidence.zip
          echo 'AOI_WIN_SIM11_PACKAGE_PASS host=1 ui=1 diagnostics=1 redacted_bundle_verified=1'
      - name: Real Windows seven-page mouse navigation and dual-Core ROI operation
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -File qa/Windows-Operator-Smoke.ps1 -PackageRoot .artifacts/dist/AOI_SIM11_Windows -EvidenceRoot .artifacts/windows-operator-smoke -TimeoutSeconds 110 -TryCi1080p
          $operatorExit = $LASTEXITCODE
          if ($operatorExit -eq 3) {
            Write-Warning 'A5_NATIVE_GUI_OPERATION_PASS: two real desktops, 14 mouse navigations and dual-Core ROI are verified; hosted 1920x1080 visual readability remains NOT_VERIFIED'
            exit 0
          }
          if ($operatorExit -ne 0) {
            Write-Host ('A5_NATIVE_GUI_OPERATION_FAIL: actual EXE workflow returned code '+$operatorExit+'; see dedicated desktop screenshot/report artifact')
            exit 1
          }
          Write-Host 'A5_WINDOWS_INTERACTIVE_DESKTOP_PASS: real native seven-page GUI and 1080p evidence'
      - name: Upload Windows x64 SIM_ONLY preview package
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: AOI_SIM11_Windows_Preview-${{ github.run_id }}
          path: csharp/.artifacts/dist/AOI_SIM11_Windows/
          retention-days: 14
          if-no-files-found: error
      - name: Upload native Windows operator screen and click evidence
        if: always() && matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: AOI_Agent05_Windows_Desktop_Evidence-${{ github.run_id }}
          path: csharp/.artifacts/windows-operator-smoke/
          retention-days: 14
          if-no-files-found: warn
      - name: Save logs on failure and success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent05-qa-${{ matrix.os }}-${{ github.run_id }}
          path: csharp/.artifacts/
          retention-days: 14
          if-no-files-found: warn
