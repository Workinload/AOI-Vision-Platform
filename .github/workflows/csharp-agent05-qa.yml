name: Agent05 CSharp SIM_ONLY Quality Gate
on:
  pull_request:
    paths: ['csharp/**', '.github/workflows/csharp-agent05-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sim-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent virtual FINS fault-fixture Python unit tests
        run: python -m unittest discover -s qa -p 'test_*.py' -v
      - name: Restore pinned dependencies
        shell: bash
        run: |
          unset PLATFORM
          dotnet restore AOI.slnx --source https://api.nuget.org/v3/index.json -p:NuGetAudit=false
      - name: Build and NUnit negative path tests
        shell: bash
        run: |
          unset PLATFORM
          dotnet build AOI.slnx --no-restore -c Debug
          dotnet test AOI.slnx --no-build -c Debug --logger 'console;verbosity=normal'
      - name: Real five-process normal scenario
        run: python scripts/e2e_sim_light.py --evidence-root .artifacts/qa-normal
      - name: Verify SQLite WAL identities source images and PERSISTED_ACK
        run: python qa/integrity_audit.py --evidence-root .artifacts/qa-normal
      - name: Real five-process 9-device 11-channel SIM_LIGHT integration
        run: python scripts/e2e_sim_light.py --all-channels --evidence-root .artifacts/qa-11channels
      - name: Real five-process controlled barcode flip fail closed
        run: python qa/chaos_e2e.py --evidence-root .artifacts/qa-barcode-flip
      - name: Full 11-channel independent asset and PeerLink audit with corrupted end barcode
        run: python qa/chaos_e2e.py --all-channels --evidence-root .artifacts/qa-11channels-barcode-flip
      - name: SIM_FULL five-process FIFO multi-workpiece with repeated barcodes
        run: python scripts/e2e_sim_full.py --count 5 --repeat-barcode --evidence-root .artifacts/simfull-normal
      - name: SIM_FULL five-process end-barcode corruption must block physical exit
        run: python scripts/e2e_sim_full.py --count 5 --flip-token 3 --evidence-root .artifacts/simfull-flipped
      - name: A6 immutable solution edit publish dual-node commit and live SIM_FULL recipe
        run: python scripts/e2e_sim_full.py --with-product --count 5 --evidence-root .artifacts/simfull-recipe
      - name: SIM_FULL actual operator PNGs, OpenCV contour NG and line row-deinterleave
        run: python scripts/e2e_sim_full.py --with-images --count 5 --evidence-root .artifacts/simfull-real-png
      - name: Publish Windows x64 framework-dependent SIM_ONLY preview
        if: matrix.os == 'windows-2025'
        shell: bash
        run: |
          set -e
          unset PLATFORM
          dotnet restore AOI.slnx -r win-x64 --source https://api.nuget.org/v3/index.json -p:NuGetAudit=false
          dotnet publish src/AOI.Host/AOI.Host.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/Host
          dotnet publish src/AOI.Ui.Avalonia/AOI.Ui.Avalonia.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/UI
          dotnet publish src/AOI.Diagnostics.Cli/AOI.Diagnostics.Cli.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/Diagnostics
          dotnet publish src/AOI.Solutions.Cli/AOI.Solutions.Cli.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/Recipes
          dotnet publish tools/AOI.Vision.Cli/AOI.Vision.Cli.csproj --no-restore -c Release -r win-x64 --self-contained false -o .artifacts/dist/AOI_SIM11_Windows/VisionLab
          cp scripts/Launch-SIM11.cmd .artifacts/dist/AOI_SIM11_Windows/Launch-SIM11.cmd
          cp scripts/Launch-SIMFULL.cmd .artifacts/dist/AOI_SIM11_Windows/Launch-SIMFULL.cmd
          cp scripts/Configure-SIM-Recipe.cmd .artifacts/dist/AOI_SIM11_Windows/Configure-SIM-Recipe.cmd
          cp scripts/WINDOWS_SIM11_PREVIEW.txt .artifacts/dist/AOI_SIM11_Windows/README.txt
          test -f .artifacts/dist/AOI_SIM11_Windows/Host/AOI.Host.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/UI/AOI.Ui.Avalonia.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/Diagnostics/AOI.Diagnostics.Cli.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/Recipes/AOI.Solutions.Cli.exe
          test -f .artifacts/dist/AOI_SIM11_Windows/VisionLab/AOI.Vision.Cli.exe
          dotnet .artifacts/dist/AOI_SIM11_Windows/Diagnostics/AOI.Diagnostics.Cli.dll verify .artifacts/qa-11channels/diagnostics/evidence.zip
          echo 'AOI_WIN_SIM11_PACKAGE_PASS host=1 ui=1 diagnostics=1 redacted_bundle_verified=1'
      - name: Upload Windows x64 SIM_ONLY preview package
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: AOI_SIM11_Windows_Preview-${{ github.run_id }}
          path: csharp/.artifacts/dist/AOI_SIM11_Windows/
          retention-days: 14
          if-no-files-found: error
      - name: Save logs on failure and success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent05-qa-${{ matrix.os }}-${{ github.run_id }}
          path: csharp/.artifacts/
          retention-days: 14
          if-no-files-found: warn
